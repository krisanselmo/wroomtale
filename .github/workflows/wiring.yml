# The wiring diagram lives as HTML in hardware/, not as a binary nobody can diff.
# This renders it to the PNGs the README embeds, so the two never drift apart.
name: wiring diagram

on:
  push:
    paths:
      - hardware/wiring.html
      - hardware/wiring_render.mjs
      - hardware/package-lock.json
      - .github/workflows/wiring.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiring-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    # Everything the diagram needs is in hardware/.
    defaults:
      run:
        working-directory: hardware
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hardware/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node wiring_render.mjs

      # Chromium is pinned by package-lock, so an unchanged page renders to
      # identical bytes and this stays quiet.
      - name: commit the images if they moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img
          if git diff --cached --quiet; then
            echo "diagramme inchange"
            exit 0
          fi
          git commit -m "chore: re-render the wiring diagram [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
