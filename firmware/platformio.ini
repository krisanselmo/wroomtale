; One build does the lot. What the box is depends on what is plugged into it
; and on what the panel is told -- not on which binary was flashed.
;
; No use profiles: between the fattest and the leanest they would save 132 kB
; of flash on a 3,87 MB app partition 36 % full, and cost a matrix of
; combinations to keep in step. Turning the radio off is a runtime
; decision, not a build one -- an unused WiFi stack costs flash, never current.
;
;   pio run -t upload                       the box
;   pio run -e wroomtale-volume -t upload   buttons set on the volume
;   pio run -e bt -t upload                 A2DP spike, run by hand
;   pio test -e native -e native-volume     unit tests, on this machine
;
; Trimming by hand works: -DFEAT_PORTAL=0 and its friends drop a volet,
; source included (see include/Features.h). No profile ships that way.

[platformio]
default_envs = wroomtale

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino

board_build.partitions = partitions_4mb_noota.csv
board_build.f_cpu = 240000000L

; The portal page lives in web/index.html; this keeps PortalPage.h in step.
extra_scripts = pre:web/build_page.py

; Every test runs on the host (env:native): none is ever flashed.
test_ignore = *

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

build_flags =
	-std=gnu++17
	-DCORE_DEBUG_LEVEL=3
	; Helix MP3 decoder in IRAM: without PSRAM this is what keeps playback gapless
	-DMP3_DECODER_IN_IRAM=1
build_unflags = -std=gnu++11

lib_deps = earlephilhower/ESP8266Audio@^2.4.1

[lib]
rfid = adafruit/Adafruit PN532@^1.3.4
; Pinned exactly, not by caret: 3.10.5 refuses to build against the legacy
; RMT4 driver this box asks for below, and a fresh libdeps would have picked
; it up silently.
leds = fastled/FastLED@3.10.3

; The RMT driver refills its buffer from an interrupt, and the WiFi stack can
; delay that refill -- the first LEDs get correct data, the rest garbage.
; One channel gets every RMT memory block: 10 LEDs need 240 symbols and 8
; blocks hold 512, so the whole frame is sent in one shot with no refill.
[ledflags]
flags = -DFASTLED_RMT5=0 -DFASTLED_RMT_MAX_CHANNELS=1 -DFASTLED_ESP32_FLASH_LOCK=1

; ------------------------------------------------------------- wroomtale
[env:wroomtale]
extends = base
build_flags = ${base.build_flags} ${ledflags.flags}
build_src_filter = +<*> -<Bt.cpp>
lib_deps = ${base.lib_deps}
	${lib.rfid}
	${lib.leds}

; ------------------------------------------------------- wroomtale-volume
; Same binary, another reading of the buttons: red and blue step the volume on
; a click and ramp it when held; next track moves to a double click on green.
; A behaviour profile, not a content one -- nothing leaves the build.
[env:wroomtale-volume]
extends = env:wroomtale
build_flags = ${base.build_flags} ${ledflags.flags} -DBTN_SCHEME=1

; --------------------------------------------------------------------- bt
; Spike, not a use profile. The box build plus Bluedroid as an A2DP source,
; to answer two questions: how much heap is left once the BT stack is up, and
; does discovery survive the WiFi radio being on?
[env:bt]
extends = base
build_flags = ${base.build_flags} ${ledflags.flags} -DFEAT_BT=1
build_src_filter = +<*>
lib_deps = ${base.lib_deps}
	${lib.rfid}
	${lib.leds}
	; not in the PlatformIO registry: pinned by tag, not by branch
	https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.11

; The configuration the feature would actually ship as: BT in play mode, so
; no portal and no WiFi to share the radio or the heap with.
[env:bt-lecture]
extends = base
build_flags = ${base.build_flags} ${ledflags.flags} -DFEAT_BT=1 -DFEAT_PORTAL=0
build_src_filter = +<*> -<ConfigPortal.cpp> -<WifiCreds.cpp>
lib_deps = ${base.lib_deps}
	${lib.rfid}
	${lib.leds}
	https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.11

; ----------------------------------------------------------------- native
; The logic that needs no hardware, tested on this machine: target rules,
; the story graph, the button scheme, JSON escaping.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<Story.cpp> +<ButtonScheme.cpp>
build_flags = -std=gnu++17 -Isrc -Iinclude -Itest/shims -include native_shim.h
lib_deps = fabiobatsilva/ArduinoFake@0.4.0

[env:native-volume]
extends = env:native
build_flags = ${env:native.build_flags} -DBTN_SCHEME=1
